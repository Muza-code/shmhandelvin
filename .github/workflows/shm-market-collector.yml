name: SHM Market Collector

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_collector/**'
      - '.github/workflows/shm-market-collector.yml'
  schedule:
    - cron: '17 5 * * *'
    - cron: '17 17 * * *'

permissions:
  contents: write

concurrency:
  group: shm-market-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: market_collector/requirements.txt
      - run: pip install -r market_collector/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Collect and normalize market data
        env:
          MOBILEDE_USERNAME: ${{ secrets.MOBILEDE_USERNAME }}
          MOBILEDE_PASSWORD: ${{ secrets.MOBILEDE_PASSWORD }}
          SHM_INGEST_URL: ${{ secrets.SHM_INGEST_URL }}
          SHM_INGEST_TOKEN: ${{ secrets.SHM_INGEST_TOKEN }}
        run: python market_collector/collector.py --config market_collector/config.json --out out
      - name: Build Market Center dataset
        run: python market_collector/build_dashboard_data.py
      - name: Commit refreshed public market dataset
        run: |
          if git diff --quiet -- data/latest_market.json; then
            echo "No dataset change"
          else
            git config user.name "shm-market-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/latest_market.json
            git commit -m "data: refresh public market snapshot"
            git pull --rebase --autostash origin main
            git push
          fi
      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: shm-market-${{ github.run_id }}
          path: out/
          retention-days: 30
